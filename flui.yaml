kind: Application
apiVersion: flui/v1

metadata:
  name: my-astro-app

build:
  strategy: dockerfile
  dockerfile: ./Dockerfile

deploy:
  port: 80
  exposure: public
  healthcheck:
    path: /health
    port: 80
  resources:
    profile: small
  scaling:
    min: 1
    max: 1
  domain:
    auto: true
    tls: true
  env: []
