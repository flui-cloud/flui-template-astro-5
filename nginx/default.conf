server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # ^~ promotes this prefix above the regex blocks below; without it nginx
    # would let the generic css/js regex win and /_astro/* would only get
    # max-age=3600 instead of the intended immutable 1y on fingerprinted files.
    location ^~ /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
